# Dataset
data_path: "/checkpoint/fsx-ai-society/claudiashi/datasets/processed/pew_w152_user_disjoint_5q/train_t5"
eval_data_path: "/checkpoint/fsx-ai-society/claudiashi/datasets/processed/pew_w152_user_disjoint_5q/validation_t5"
max_length: 512
max_input_length: 384
pad_token: eos

# Tokenizer / Encoder
tokenizer_name: /checkpoint/fsx-ai-society/claudiashi/huggingface/transformers/models--t5-small/snapshots/df1b051c49625cf57a3d0d8d3863ed4d13564fe4
encoder_model_name: t5-small
encoder_checkpoint: "embedded-language-flows/t5_small_encoder_jax/t5_small_encoder_jax.pkl"
latent_mean: 0.0
latent_std: 0.2

# Model architecture
model: ELF-B
bottleneck_dim: 128
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4

# Denoiser objective
denoiser_p_mean: -1.5
denoiser_p_std: 0.8
denoiser_noise_scale: 2.0
t_eps: 0.05
time_schedule: "logit_normal"

# Decoder objective
decoder_prob: 0.2
decoder_noise_scale: 1.0
decoder_p_mean: 0.8
decoder_p_std: 0.8

# Conditioning / CFG
label_drop_prob: 0.1
self_cond_prob: 0.5

# Training
epochs: 10
global_batch_size: 64
blr: 0.001
weight_decay: 0.0
warmup_steps: 100
optimizer: muon

# EMA
ema_decay1: 0.9999

# Sampling
sampling_configs_path: "configs/sampling_configs/cond_sampling_configs.yml"
num_samples: 32

# Logging & Checkpointing
log_freq: 10
save_freq: 1
eval_freq: 2
print_model_summary: false

# Output
output_dir: "/checkpoint/fsx-ai-society/claudiashi/elf_runs/finetune/pew_w152_elf_b"
hf_repo_id: null
resume: null
init_checkpoint: "embedded-language-flows/ELF-B-owt"

# Wandb
use_wandb: true
wandb_project: elf
wandb_entity: null
wandb_run_name: finetune_pew_w152_elf_b
wandb_resume: allow

# Misc
seed: 42
